name: par2cmdline release build

on:
  push:
    branches:
    - 'turbo'
    # Kept here rather than relying on workflow_dispatch below: dispatch is
    # only offered for workflows whose file already declares it on the default
    # branch, and master's copy does not. Until that changes, a push trigger is
    # the only way to exercise the release matrix from this branch -- which
    # matters while the Windows jobs are the thing under test. Remove when the
    # branch merges.
    - 'feature/gpu-gf16'
  # Build the full artifact matrix from any branch on demand. Unusable until
  # this trigger reaches the default branch; see above.
  workflow_dispatch:

jobs:
  build-check-linux:
    uses: ./.github/workflows/build-check-linux.yml

  build-check-windows:
    uses: ./.github/workflows/build-check-windows.yml

  build-check-macos:
    uses: ./.github/workflows/build-check-macos.yml

  build-check-freebsd:
    uses: ./.github/workflows/build-check-freebsd.yml

  build-linux:
    needs:
    - build-check-linux

    name: build-linux (${{ matrix.arch }})

    strategy:
      matrix:
        include:
        - arch: amd64
          configure_host:
          xcc:
        - arch: arm64
          configure_host: --host=aarch64-linux-gnu
          xcc: aarch64-linux-gnu-
        - arch: armhf
          configure_host: --host=armv7l-linux-gnueabihf
          xcc: arm-linux-gnueabihf-

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install cross toolchains
      if: matrix.arch != 'amd64'
      run: |
        sudo apt-get update
        case "${{ matrix.arch }}" in
          arm64)
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross
            ;;
          armhf)
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf libc6-dev-armhf-cross
            ;;
        esac

    - name: Build
      env:
        CC: ${{ matrix.xcc }}gcc
        CXX: ${{ matrix.xcc }}g++
        LDFLAGS: -static -s
      run: |
        ./automake.sh
        ./configure ${{ matrix.configure_host }}
        make -j"$(nproc)"

    - name: Upload binary artifact
      uses: actions/upload-artifact@v7
      with:
        name: par2cmdline-turbo-linux-${{ matrix.arch }}
        path: |
          par2
        retention-days: 5

  # GPU-enabled Linux build, shipped alongside the static ones above rather
  # than replacing them, because the two cannot be the same binary: the Vulkan
  # backend resolves the driver with dlopen, which is unreliable from a fully
  # static glibc binary - and running anywhere is the whole point of the static
  # build. So there are two artifacts: a static CPU-only one that runs on old
  # distros, and this, which needs a glibc at least as new as the runner's but
  # can use a GPU.
  #
  # amd64 only. The headers are architecture-independent, but a cross-build
  # would need them installed for the target multiarch, and Linux discrete GPUs
  # are overwhelmingly amd64 - which is where the measured 5x lives.
  build-linux-gpu:
    needs:
    - build-check-linux

    name: build-linux-gpu (amd64)

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    # Headers and a shader compiler only; the driver is found at runtime, so
    # neither a GPU nor the loader library is needed to build.
    - name: Install Vulkan build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libvulkan-dev glslang-tools

    # Note the absence of -static, unlike the CPU builds. -s still strips.
    - name: Build
      env:
        LDFLAGS: -s
      run: |
        ./automake.sh
        ./configure --enable-vulkan
        make -j"$(nproc)"

    # Records what this binary actually needs at runtime, which is the whole
    # reason it is a separate artifact.
    - name: Report runtime dependencies
      run: |
        ./par2 --list-gpus
        ldd par2

    - name: Upload binary artifact
      uses: actions/upload-artifact@v7
      with:
        name: par2cmdline-turbo-linux-amd64-gpu
        path: |
          par2
        retention-days: 5

  build-windows:
    needs:
    - build-check-windows

    name: build-windows (${{ matrix.name }})

    strategy:
      matrix:
        include:
        - platform: x64
          name: x64
        - platform: ARM64
          name: arm64

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    # Released Windows binaries were CPU-only until this step existed: the
    # runner has no Vulkan SDK and parpar/gf16.vcxproj auto-detects it, so the
    # GPU backend was silently compiled out. glslangValidator runs as a host
    # tool and the loader is resolved with LoadLibrary at runtime, so one x64
    # SDK install serves the ARM64 build too.
    - name: Install Vulkan headers and glslang
      shell: pwsh
      env:
        VULKAN_HEADERS_TAG: vulkan-sdk-1.4.357.0
        GLSLANG_TAG: 16.5.0
      run: .\.github\scripts\install-vulkan-build-deps.ps1

    - name: Build
      run: msbuild -property:ParParVulkan=true -property:PlatformToolset=ClangCL -property:Configuration=Release -property:Platform=${{ matrix.platform }} par2cmdline.sln

    - name: Verify the Vulkan backend was compiled in
      shell: pwsh
      run: |
        if (-not (Test-Path parpar\gf16\gf16_vulkan_spv.h)) {
          throw "gf16_vulkan_spv.h missing: the Vulkan backend was not built"
        }

    - name: Upload binary artifact
      uses: actions/upload-artifact@v7
      with:
        name: par2cmdline-turbo-win-${{ matrix.name }}
        path: |
          ${{ matrix.platform }}/Release/par2.exe
        retention-days: 5

  build-macos:
    needs:
    - build-check-macos

    name: build-macos (${{ matrix.arch }})

    strategy:
      matrix:
        include:
        - arch: amd64
          xcxxflags: -arch x86_64 -mmacosx-version-min=10.13
        - arch: arm64
          xcxxflags: -arch arm64 -mmacosx-version-min=11.0

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7

    - name: prepare
      run: brew install automake

    # NOTE: setting CFLAGS/CXXFLAGS suppresses autoconf's default "-g -O2",
    # so -O2 must be passed explicitly or the build ends up unoptimised.
    # OBJCXXFLAGS matters as much as CXXFLAGS here: the Metal backend is
    # Objective-C++, and automake compiles .mm with OBJCXX. Without the arch
    # flag those objects build for the runner's native architecture while
    # everything else is cross-compiled, and the link fails with undefined
    # PAR2ProcMetal symbols for the target arch.
    - name: Build
      env:
        CFLAGS: -O3 ${{ matrix.xcxxflags }}
        CXXFLAGS: -O3 ${{ matrix.xcxxflags }}
        OBJCXXFLAGS: -O3 ${{ matrix.xcxxflags }}
      run: |
        ./automake.sh
        ./configure
        make -j"$(sysctl -n hw.ncpu)"
        strip par2

    - name: Upload binary artifact
      uses: actions/upload-artifact@v7
      with:
        name: par2cmdline-turbo-macos-${{ matrix.arch }}
        path: |
          par2
        retention-days: 5

  build-macos-universal:
    needs:
    - build-macos

    runs-on: macos-latest

    steps:
    - name: Download slices
      uses: actions/download-artifact@v7
      with:
        pattern: par2cmdline-turbo-macos-*

    - name: Create universal binary
      run: |
        lipo -create \
          par2cmdline-turbo-macos-amd64/par2 \
          par2cmdline-turbo-macos-arm64/par2 \
          -output par2
        lipo -info par2

    - name: Upload binary artifact
      uses: actions/upload-artifact@v7
      with:
        name: par2cmdline-turbo-macos-universal
        path: |
          par2
        retention-days: 5

  build-freebsd:
    needs:
    - build-check-freebsd

    name: build-freebsd (${{ matrix.arch }})

    strategy:
      matrix:
        include:
        - arch: x86-64
          artifact_arch: amd64
        - arch: arm64
          artifact_arch: aarch64

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Build on FreeBSD
      uses: cross-platform-actions/action@v1.3.0
      env:
        LDFLAGS: -static -s
      with:
        operating_system: freebsd
        version: '15.0'
        architecture: ${{ matrix.arch }}
        environment_variables: LDFLAGS
        shell: sh
        run: |
          sudo pkg install -y autoconf automake libtool
          ./automake.sh
          ./configure
          make -j"$(nproc)"
          strip par2

    - name: Upload binary artifact
      uses: actions/upload-artifact@v7
      with:
        name: par2cmdline-turbo-freebsd-${{ matrix.artifact_arch }}
        path: |
          par2
        retention-days: 5
