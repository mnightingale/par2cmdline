name: par2cmdline CI FreeBSD

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-check-freebsd:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Build and test
      uses: cross-platform-actions/action@v1.3.0
      with:
        operating_system: freebsd
        version: '15.0'
        shell: bash
        run: |
          sudo pkg install -y autoconf automake libtool
          ./automake.sh
          ./configure
          # nproc is GNU coreutils and is not in the FreeBSD base system, so
          # it expands to nothing here and make silently builds single-job.
          make -j"$(sysctl -n hw.ncpu)"
          make check
          make distcheck